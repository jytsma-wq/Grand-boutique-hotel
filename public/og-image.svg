<?xml version="1.0" encoding="utf-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Sea -->
  <rect x="0" y="350" width="1200" height="280" fill="url(#sea)"/>
  
  <!-- Waves -->
  <path d="M0 350 Q 150 380 300 350 T 600 350 T 900 350 T 1200 350 L 1200 400 L 0 400 Z" fill="#0f3460" opacity="0.5"/>
  <path d="M0 370 Q 150 340 300 370 T 600 370 T 900 370 T 1200 370 L 1200 420 L 0 420 Z" fill="#0f3460" opacity="0.3"/>
  
  <!-- Hotel silhouette -->
  <rect x="400" y="200" width="400" height="300" fill="#2d2d2d"/>
  <rect x="350" y="150" width="100" height="100" fill="#2d2d2d"/>
  <rect x="750" y="150" width="100" height="100" fill="#2d2d2d"/>
  
  <!-- Windows -->
  <g fill="#ffd700" opacity="0.8">
    <rect x="430" y="230" width="40" height="50"/>
    <rect x="490" y="230" width="40" height="50"/>
    <rect x="550" y="230" width="40" height="50"/>
    <rect x="610" y="230" width="40" height="50"/>
    <rect x="670" y="230" width="40" height="50"/>
    <rect x="730" y="230" width="40" height="50"/>
    
    <rect x="430" y="310" width="40" height="50"/>
    <rect x="490" y="310" width="40" height="50"/>
    <rect x="550" y="310" width="40" height="50"/>
    <rect x="610" y="310" width="40" height="50"/>
    <rect x="670" y="310" width="40" height="50"/>
    <rect x="730" y="310" width="40" height="50"/>
    
    <rect x="430" y="390" width="40" height="50"/>
    <rect x="490" y="390" width="40" height="50"/>
    <rect x="550" y="390" width="40" height="50"/>
    <rect x="610" y="390" width="40" height="50"/>
    <rect x="670" y="390" width="40" height="50"/>
    <rect x="730" y="390" width="40" height="50"/>
  </g>
  
  <!-- Logo -->
  <g transform="translate(560, 80)">
    <rect x="0" y="0" width="80" height="80" rx="8" fill="#2d2d2d" stroke="#fff" stroke-width="2"/>
    <path fill="#fff" d="M20 25 L25 35 L30 28 L35 35 L40 25 Z"/>
    <path fill="#fff" d="M20 55 L25 45 L30 52 L35 45 L40 55 Z"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="560" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="48" font-weight="bold">Grand Boutique Hotel</text>
  <text x="600" y="600" text-anchor="middle" fill="#ffd700" font-family="Georgia, serif" font-size="24">Batumi, Georgia</text>
</svg>
